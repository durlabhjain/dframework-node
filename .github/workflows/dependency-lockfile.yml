name: Dependency Lockfile

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'yarn.lock'
      - '.npmrc'
      - '.yarnrc.yml'
      - 'tests/dependency-security.test.mjs'
      - '.github/workflows/dependency-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          version: '1.4.0'
          node-version: '24.21.0'
          run-install: false
      - name: Install committed dependencies
        run: yarn install --immutable
      - name: Check offline dependency behavior
        run: node --test --test-concurrency=1 tests/dependency-security.test.mjs
      - name: Check exports
        run: node tests/verify-exports.mjs
      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- yarn.lock
